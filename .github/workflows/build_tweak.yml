name: Build YouTube Plus tweak (from source)

on:
  workflow_dispatch:
    inputs:
      tweak_version:
        description: "Version label for the built deb"
        default: "5.2.2"
        required: true
        type: string

jobs:
  build-tweak:
    name: Build tweak from source
    runs-on: macos-latest

    steps:
      - name: Install Dependencies
        run: brew install make ldid dpkg

      - name: Set PATH environment variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5
        env:
          cache-name: theos_cache_9bc7340
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: ytplus-src

      - name: Clone YouTubeHeader (build dependency)
        run: |
          [ -d YouTubeHeader ] || git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git YouTubeHeader

      - name: Clone protobuf headers (build dependency)
        run: |
          if [ ! -d protobuf ]; then
            git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/protocolbuffers/protobuf.git protobuf
            cd protobuf
            git sparse-checkout set --no-cone objectivec
            git checkout
          fi

      - name: Build tweak
        run: |
          cd ytplus-src
          sed -i '' "s/^Version: .*/Version: ${{ inputs.tweak_version }}/" control
          sed -i '' "s/^PACKAGE_VERSION = .*/PACKAGE_VERSION = ${{ inputs.tweak_version }}/" Makefile
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../ytplus.deb
          cd ..
          dpkg-deb -I ytplus.deb

      - name: Upload built deb
        uses: actions/upload-artifact@v7
        with:
          name: ytplus-deb
          path: ytplus.deb
          retention-days: 7
